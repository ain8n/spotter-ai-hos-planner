<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Rounded Squircle App Badge -->
  <rect x="20" y="20" width="472" height="472" rx="100" fill="#0f172a" stroke="#2563eb" stroke-width="24" />
  
  <!-- Subtle Internal Gradient / Top Glow -->
  <rect x="32" y="32" width="448" height="224" rx="88" fill="#1e3a8a" opacity="0.35" />

  <!-- Center Lucide-Style Semi Truck Brand Mark -->
  <g transform="translate(64, 76) scale(16)" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main Trailer Body -->
    <path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2" fill="#2563eb" fill-opacity="0.25" />
    <!-- Chassis Connector -->
    <path d="M15 18H9" stroke="#60a5fa" stroke-width="2.2" />
    <!-- Cab and Aerodynamic Windshield -->
    <path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14" fill="#3b82f6" fill-opacity="0.3" />
    <!-- Wheels -->
    <circle cx="17" cy="18.5" r="2.5" fill="#0f172a" stroke="#60a5fa" stroke-width="2" />
    <circle cx="7" cy="18.5" r="2.5" fill="#0f172a" stroke="#60a5fa" stroke-width="2" />
  </g>

  <!-- Compliance Green Check Badge on Top Right -->
  <circle cx="396" cy="116" r="44" fill="#10b981" stroke="#0f172a" stroke-width="10" />
  <path d="M380 116 L392 128 L414 104" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
</svg>
